# Star ranking window in days. GitHub Trending only publishes daily/weekly/monthly,
# so only 1, 7 and 30 are accepted.
period_days: 30
# How many repositories to put in the report table.
top_n: 20
# Language slugs used for https://github.com/trending/<slug> pages.
languages:
  - python
  - typescript
  - javascript
  - rust
  - go
  - java
  - "c++"
  - "c%23"
  - shell
  - ruby
  - php
  - kotlin
  - swift
  - dart
  - scala
  - haskell
  - elixir
  - lua
  - r
  - zig
  - html
  - css
  - jupyter-notebook
  - clojure
  - powershell
  - solidity
  - objective-c
  - perl
  - "f%23"
  - erlang
  - ocaml
  - fortran
  - vue
# Optional: raises GitHub REST limit from 60 to 5000 requests/hour.
github_token: ""
# Use GitHub's daily star history first for missing Trending gains.
enable_github_history: true
# Use OSSInsight only if GitHub star history cannot cover a window.
enable_ossinsight_estimate: true
# 为榜单翻译简介：Azure / Google（配置凭据时）→ 免登录 MyMemory → 本地接口。
# 凭据只放环境变量：AZURE_TRANSLATOR_KEY、AZURE_TRANSLATOR_REGION（按需）、
# GOOGLE_TRANSLATE_API_KEY；MyMemory 无需配置，每日匿名额度 5000 字符。
# 不希望将公开简介发送第三方时设为 false；全部失败则保留英文。
enable_chinese_summary: true
# Report destination (relative to project root).
output_dir: output
